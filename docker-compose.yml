# Sarah AI Agent — full stack. Coolify-compatible.
# Copy .env.example to .env and adjust before running `docker compose up`.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${SARAH_DB_NAME:-sarah}
      POSTGRES_USER: ${SARAH_DB_USERNAME:-sarah}
      POSTGRES_PASSWORD: ${SARAH_DB_PASSWORD:-sarah}
    volumes:
      - sarah_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SARAH_DB_USERNAME:-sarah} -d ${SARAH_DB_NAME:-sarah}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./sarah-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SARAH_DB_URL: jdbc:postgresql://db:5432/${SARAH_DB_NAME:-sarah}
      SARAH_DB_USERNAME: ${SARAH_DB_USERNAME:-sarah}
      SARAH_DB_PASSWORD: ${SARAH_DB_PASSWORD:-sarah}
      SARAH_REDIS_HOST: redis
      SARAH_REDIS_PORT: "6379"
      SARAH_ADMIN_EMAIL: ${SARAH_ADMIN_EMAIL:-owner@oreostudios.com}
      SARAH_ADMIN_PASSWORD: ${SARAH_ADMIN_PASSWORD:-change-me-now}
      SARAH_TOKEN_KEY: ${SARAH_TOKEN_KEY:-}
      SARAH_LLM_PROVIDER: ${SARAH_LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SARAH_LLM_MODEL: ${SARAH_LLM_MODEL:-claude-opus-4-8}
      SARAH_CORS_ORIGINS: ${SARAH_CORS_ORIGINS:-http://localhost:8088}
      SARAH_AUTH_HMAC_SECRET: ${SARAH_AUTH_HMAC_SECRET:-}
      SARAH_AUTH_EMAIL_PROVIDER: ${SARAH_AUTH_EMAIL_PROVIDER:-log}
      SARAH_AUTH_EMAIL_FROM: ${SARAH_AUTH_EMAIL_FROM:-Sarah <sarah@oreostudios.com>}
      SARAH_MAIL_HOST: ${SARAH_MAIL_HOST:-}
      SARAH_MAIL_PORT: ${SARAH_MAIL_PORT:-587}
      SARAH_MAIL_USERNAME: ${SARAH_MAIL_USERNAME:-}
      SARAH_MAIL_PASSWORD: ${SARAH_MAIL_PASSWORD:-}
      SARAH_COOKIE_SECURE: ${SARAH_COOKIE_SECURE:-false}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./sarah-frontend
    depends_on:
      - backend
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  sarah_db:
