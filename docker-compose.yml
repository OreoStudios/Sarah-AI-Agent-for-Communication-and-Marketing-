# Sarah AI Agent — full stack. Coolify-compatible.
# Copy .env.example to .env and adjust before running `docker compose up`.

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${SARAH_DB_NAME:-sarah}
      POSTGRES_USER: ${SARAH_DB_USERNAME:-sarah}
      POSTGRES_PASSWORD: ${SARAH_DB_PASSWORD:-sarah}
    volumes:
      - sarah_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SARAH_DB_USERNAME:-sarah} -d ${SARAH_DB_NAME:-sarah}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./sarah-backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SARAH_DB_URL: jdbc:postgresql://db:5432/${SARAH_DB_NAME:-sarah}
      SARAH_DB_USERNAME: ${SARAH_DB_USERNAME:-sarah}
      SARAH_DB_PASSWORD: ${SARAH_DB_PASSWORD:-sarah}
      SARAH_REDIS_HOST: redis
      SARAH_REDIS_PORT: "6379"
      SARAH_ADMIN_EMAIL: ${SARAH_ADMIN_EMAIL:-owner@oreostudios.com}
      SARAH_ADMIN_PASSWORD: ${SARAH_ADMIN_PASSWORD:-change-me-now}
      SARAH_TOKEN_KEY: ${SARAH_TOKEN_KEY:-}
      SARAH_LLM_PROVIDER: ${SARAH_LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SARAH_LLM_MODEL: ${SARAH_LLM_MODEL:-claude-opus-4-8}
      SARAH_CORS_ORIGINS: ${SARAH_CORS_ORIGINS:-http://localhost:8088}
      SARAH_AUTH_HMAC_SECRET: ${SARAH_AUTH_HMAC_SECRET:-}
      SARAH_AUTH_EMAIL_PROVIDER: ${SARAH_AUTH_EMAIL_PROVIDER:-log}
      SARAH_AUTH_EMAIL_FROM: ${SARAH_AUTH_EMAIL_FROM:-Sarah <sarah@oreostudios.com>}
      SARAH_MAIL_HOST: ${SARAH_MAIL_HOST:-}
      SARAH_MAIL_PORT: ${SARAH_MAIL_PORT:-587}
      SARAH_MAIL_USERNAME: ${SARAH_MAIL_USERNAME:-}
      SARAH_MAIL_PASSWORD: ${SARAH_MAIL_PASSWORD:-}
      SARAH_COOKIE_SECURE: ${SARAH_COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SARAH_OPENAI_MODEL: ${SARAH_OPENAI_MODEL:-gpt-4.1-mini}
      SARAH_MEMORY_ENABLED: ${SARAH_MEMORY_ENABLED:-false}
      SARAH_SOCIAL_LINKEDIN_ENABLED: ${SARAH_SOCIAL_LINKEDIN_ENABLED:-false}
      SARAH_LINKEDIN_API_VERSION: ${SARAH_LINKEDIN_API_VERSION:-}
      SARAH_SOCIAL_FACEBOOK_ENABLED: ${SARAH_SOCIAL_FACEBOOK_ENABLED:-false}
      SARAH_FACEBOOK_API_VERSION: ${SARAH_FACEBOOK_API_VERSION:-}
      SARAH_WEBSITE_WORDPRESS_ENABLED: ${SARAH_WEBSITE_WORDPRESS_ENABLED:-false}
      SARAH_WORDPRESS_URL: ${SARAH_WORDPRESS_URL:-}
      SARAH_SEARCH_CONSOLE_ENABLED: ${SARAH_SEARCH_CONSOLE_ENABLED:-false}
      SARAH_GSC_PROPERTY: ${SARAH_GSC_PROPERTY:-}
      SARAH_GSC_CLIENT_ID: ${SARAH_GSC_CLIENT_ID:-}
      SARAH_GSC_CLIENT_SECRET: ${SARAH_GSC_CLIENT_SECRET:-}
      SARAH_GSC_REFRESH_TOKEN: ${SARAH_GSC_REFRESH_TOKEN:-}
      SARAH_SOCIAL_INSTAGRAM_ENABLED: ${SARAH_SOCIAL_INSTAGRAM_ENABLED:-false}
      SARAH_INSTAGRAM_API_VERSION: ${SARAH_INSTAGRAM_API_VERSION:-}
      SARAH_SOCIAL_REDDIT_ENABLED: ${SARAH_SOCIAL_REDDIT_ENABLED:-false}
      SARAH_REDDIT_USER_AGENT: ${SARAH_REDDIT_USER_AGENT:-}
      SARAH_BRAVE_SEARCH_KEY: "${SARAH_BRAVE_SEARCH_KEY:-}"
      SARAH_PROSPECTING_ENABLED: "${SARAH_PROSPECTING_ENABLED:-false}"
      SARAH_PROSPECTING_QUERY: "${SARAH_PROSPECTING_QUERY:-}"
      SARAH_PROSPECTING_POSTAL_CODE: "${SARAH_PROSPECTING_POSTAL_CODE:-}"
      SARAH_PROSPECTING_ACTIVITY_PREFIX: "${SARAH_PROSPECTING_ACTIVITY_PREFIX:-}"
      SARAH_PROSPECTING_CRON: "${SARAH_PROSPECTING_CRON:-0 15 7 * * *}"
      SARAH_IMAGE_ENABLED: "${SARAH_IMAGE_ENABLED:-false}"
      SARAH_IMAGE_MODEL: "${SARAH_IMAGE_MODEL:-gpt-image-1.5}"
      SARAH_IMAGE_DAILY_LIMIT: "${SARAH_IMAGE_DAILY_LIMIT:-3}"
      SARAH_EMAIL_MARKETING_ENABLED: "${SARAH_EMAIL_MARKETING_ENABLED:-false}"
      SARAH_MARKETING_FROM: "${SARAH_MARKETING_FROM:-}"
      SARAH_MARKETING_REPLY_TO: "${SARAH_MARKETING_REPLY_TO:-}"
      SARAH_MARKETING_POSTAL_ADDRESS: "${SARAH_MARKETING_POSTAL_ADDRESS:-}"
      SARAH_MARKETING_PUBLIC_URL: "${SARAH_MARKETING_PUBLIC_URL:-}"
      SARAH_MARKETING_EMAIL_DAILY_LIMIT: "${SARAH_MARKETING_EMAIL_DAILY_LIMIT:-10}"
      SARAH_OPTIMIZATION_ENABLED: "${SARAH_OPTIMIZATION_ENABLED:-false}"
      SARAH_OPTIMIZATION_CRON: "${SARAH_OPTIMIZATION_CRON:-0 0 7 * * *}"
      SARAH_DAILY_PLAN_ENABLED: "${SARAH_DAILY_PLAN_ENABLED:-false}"
      SARAH_DAILY_AUTO_PUBLISH: "${SARAH_DAILY_AUTO_PUBLISH:-false}"
      SARAH_DAILY_OBJECTIVE: "${SARAH_DAILY_OBJECTIVE:-}"
      SARAH_DAILY_AUDIENCE: "${SARAH_DAILY_AUDIENCE:-}"
      SARAH_DAILY_LANGUAGE: "${SARAH_DAILY_LANGUAGE:-en}"
      SARAH_DAILY_PLATFORMS: "${SARAH_DAILY_PLATFORMS:-discord}"
      SARAH_DAILY_MAX_CHANNELS: "${SARAH_DAILY_MAX_CHANNELS:-2}"
      SARAH_DAILY_PLAN_CRON: "${SARAH_DAILY_PLAN_CRON:-0 30 7 * * *}"
      SARAH_OUTBOUND_HOSTS: ${SARAH_OUTBOUND_HOSTS:-discord.com,discordapp.com}
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./sarah-frontend
    depends_on:
      - backend
    ports:
      - "8088:80"
    restart: unless-stopped

volumes:
  sarah_db:
