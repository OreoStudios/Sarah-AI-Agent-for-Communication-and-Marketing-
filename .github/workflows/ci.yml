name: Sarah CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: sarah-backend/pom.xml
      - run: docker info
      - run: mvn -B -ntp verify
        working-directory: sarah-backend
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sarah-frontend/package-lock.json
      - run: npm ci
        working-directory: sarah-frontend
      - run: npm run build
        working-directory: sarah-frontend
